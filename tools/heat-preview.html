<script type="module">
// APPLE HEAT preview (rules agent): the thermometer at 0 / 4 / 7 / 10 Heat, and an apple glowing at each tier.
import * as THREE from 'three';
import { ThermoGauge, heatColor } from '../src/ui3d/heat.js';
import * as P3 from '../src/models/props3d.js';
await Promise.all(['11px "PixelSans"', '13px "NanoPlus"', '16px "Alagard"'].map((f) => document.fonts.load(f).catch(() => {})));

});
