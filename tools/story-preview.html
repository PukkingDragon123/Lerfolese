<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles/main.css">
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>#boot{display:none}</style></head><body><canvas id="game"></canvas>
<!-- the story cast side by side (kid Isaac, the old teacher, Newton, the god, the raccoon, the snake): ?close=1&cx=.. for faces,
     &run=1 kid runs a circle, &walk=1 the teacher shuffles, &sit=1 the teacher sits and reads, &only=kid|teacher|god|raccoon|snake, &t=sec to step -->
<script type="module">
import * as THREE from 'three';
import { Engine } from '../src/core/engine.js';
import { createKidIsaac, createTeacher, createGod, book } from '../src/models/npcs/story.js';
import { createProfessor } from '../src/models/professor.js';
const q = new URLSearchParams(location.search);
const eng = new Engine(document.getElementById('game')); window.__noAutoQuality = true; window.__game = { engine: eng };
const scene = new THREE.Scene(); scene.background = new THREE.Color(q.get('bg') || 0x6a7480);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100); const close = q.get('close');
const cx = +(q.get('cx') || 0), cy = +(q.get('cy') || 1.45), cz = +(q.get('cz') || 3.4);
if (close) { cam.position.set(cx + +(q.get('ox') || 0), cy + 0.12 + +(q.get('oy') || 0), cz); cam.lookAt(cx, cy, 0); } else { cam.position.set(0.4, 1.5, 9.6); cam.lookAt(0.4, 0.95, 0); }
eng.setWorld(scene, cam); eng.setFx({ bloom: [0.3, 0.5, 0.9], exposure: 0.95 });
const sun = new THREE.DirectionalLight(0xffd6a8, 2.4); sun.position.set(-4, 5, 6); sun.castShadow = true; scene.add(sun, new THREE.HemisphereLight(0xb8c8e8, 0x4a3a2a, 0.9));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x4a5a34 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const only = q.get('only'); const cast = [];
const add = async (k, x, mk) => { if (only && only !== k) return; const a = await mk(); a.root.position.set(only ? 0 : x, 0, 0); a.root.rotation.y = +(q.get('yaw') || 0); scene.add(a.root); cast.push(a); a.key = k; };
await add('kid', -2.2, createKidIsaac); await add('teacher', -0.8, createTeacher); await add('newton', 0.6, createProfessor); await add('god', 2.2, createGod);
await add('raccoon', 3.6, async () => { const { createBeast } = await import('../src/models/beasts/index.js'); return createBeast('raccoon', 1); }).catch((e) => console.warn(e));
await add('snake', 4.8, async () => { const { createSnake } = await import('../src/models/npcs/snake.js'); const S = createSnake(); S.place(new THREE.Vector3(0, 0, 0), Math.PI * 0.5); if (q.get('slither')) S.slitherTo(new THREE.Vector3(3, 0, 1), 0.5); return S; }).catch((e) => console.warn(e));
const kid = cast.find((a) => a.key === 'kid'), tea = cast.find((a) => a.key === 'teacher');
if (tea && q.get('sit')) { tea.sit(0.46); tea.read(true); const b = book({ open: true }); tea.hand(0).add(b); b.position.set(-0.05, 0, 0.08); }
let T = 0; const step = (dt) => {
  T += dt;
  if (kid && q.get('run')) { const a = T * 1.1; kid.root.position.set(-2.2 + Math.sin(a) * 2.2, 0, Math.cos(a) * 2.2 - 2.2); kid.root.rotation.y = a + Math.PI / 2; }
  if (tea && q.get('walk')) { tea.root.position.z = Math.sin(T * 0.2) * 1.2; tea.root.rotation.y = Math.cos(T * 0.2) > 0 ? 0 : Math.PI; }
  for (const a of cast) a.update(dt);
};
const pre = +(q.get('t') || 0); for (let i = 0; i < pre * 60; i++) step(1 / 60);
if (q.get('act')) for (const a of cast) a.act?.(q.get('act'));
eng.start((dt) => step(dt));
window.__cast = cast;
</script></body></html>
