<style>

<script type="module">

import { drawn, DRAWN_NAMES, DRAWN_FRAMES } from '../src/gfx/drawn.js';

await document.fonts.ready;

const BG = { neutral: '#8c8a90', dark: '#1a1220', brass: '#5e3c16' };

}

    if (grp !== lastGroup) { r = section(grp); lastGroup = grp; }

  const atlas = critterAtlasCanvas(); const L = CRITTER_LAYOUT; const cellPx = L.cell; const scale = Z || 2;
  const r0 = section('Critters atlas (1x, sky background)'); { const c = document.createElement('canvas'); c.width = atlas.width; c.height = atlas.height; const g = c.getContext('2d'); g.fillStyle = '#7fb6dc'; g.fillRect(0, 0, c.width, c.height); g.drawImage(atlas, 0, 0); r0.appendChild(c); }

    const strip = document.createElement('canvas'); const n = grp.frames.length; strip.width = n * cellPx * scale; strip.height = cellPx * scale; const g = strip.getContext('2d'); g.imageSmoothingEnabled = false; g.fillStyle = BG.neutral; g.fillRect(0, 0, strip.width, strip.height);

if (secs.includes('icons')) {

  for (const [k, f] of Object.entries(tiles)) { if (only && !only.includes(k)) continue; const cv = f().commit(); const c = document.createElement('canvas'); c.width = cv.width * 2; c.height = cv.height * 2; const g = c.getContext('2d'); for (const [x, y] of [[0, 0], [1, 0], [0, 1], [1, 1]]) g.drawImage(cv, x * cv.width, y * cv.height); show(c, k, r, { scale: sc, bgs: ['dark'] }); }
  const rl = section(`Leaf cards (x${sc})`); for (const k of Object.keys(LEAF_KINDS)) { if (only && !only.includes(k)) continue; show(leafCard(k), k, rl, { scale: sc, bgs: ['#7fb6dc', 'dark'] }); }
}
if (secs.includes('plants')) {
  const { PLANT_DEFS, plantFrames, plantAtlas } = await import('../src/gfx/art/plants.js'); const sc = Z || 4;
  // a little meadow scene: rows of sprites at 1x and zoomed, back to front, on a ground strip (calm frame)
  { const r = section(`Plants in a patch (frame 2 = calm, x${sc / 2})`); const names = Object.keys(PLANT_DEFS); const W = 360, H = 120; const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#f2c08a'); gr.addColorStop(0.3, '#e8d0a0'); gr.addColorStop(0.31, '#7a9a50'); gr.addColorStop(1, '#4e6e30'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    let s = 9; const rr = () => ((s = (s * 16807) % 2147483647) / 2147483647); const fr = Object.fromEntries(names.map((n) => [n, plantFrames(n)[2].commit()]));
    for (let row = 0; row < 5; row++) for (let i = 0; i < 16; i++) { const n = names[Math.floor(rr() * names.length)]; const cv = fr[n]; const x = (i / 16) * W + rr() * 12 - 6, y = 46 + row * 17 + rr() * 5; g.drawImage(cv, Math.round(x - cv.width / 2), Math.round(y - cv.height)); }
    const z = document.createElement('canvas'); z.width = W * (sc / 2); z.height = H * (sc / 2); const zg = z.getContext('2d'); zg.imageSmoothingEnabled = false; zg.drawImage(c, 0, 0, z.width, z.height); r.appendChild(z); }

    const r = section(`${name}: 5 wind frames (x${sc})`); show(strip, name, r, { scale: sc, bgs: ['#6a8a44', 'dark'] }); }

const info = document.createElement('div'); info.textContent = `built in ${(performance.now() - t0).toFixed(0)} ms`; document.body.appendChild(info);

</script></body></html>
