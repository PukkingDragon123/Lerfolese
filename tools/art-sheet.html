<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles/main.css">
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>
html,body{height:auto!important;overflow:visible!important}
body{background:#6c6a72;color:#f3e6c4;font:12px/1.3 monospace;margin:0;padding:8px}
#boot{display:none}
h2{margin:12px 0 6px;font:bold 15px monospace;color:#ffe08a;border-bottom:1px solid #8a8690}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.cell span{font-size:10px;color:#e8e2d0}
canvas{image-rendering:pixelated;display:block;flex:none}
.bgs{display:flex;gap:0;align-items:flex-end}
</style></head><body>
<script type="module">
// Artist contact sheet: every sprite and frame at 1x and zoomed, on neutral, dark and in-scene backgrounds.
// Query: ?sec=ramps,drawn,items,critters,icons  &s=<zoom>  &only=name1,name2
import { drawn, DRAWN_NAMES, DRAWN_FRAMES } from '../src/gfx/drawn.js';
import { GR as RAMP } from '../src/gfx/art/ramps.js';
window.addEventListener('error', (e) => { const p = document.createElement('pre'); p.textContent = String(e.message); document.body.appendChild(p); window.__done = true; });
await document.fonts.ready;
const Q = new URLSearchParams(location.search); const secs = (Q.get('sec') || 'ramps,drawn,items,critters,icons').split(','); const Z = Q.get('s') ? +Q.get('s') : 0; const only = Q.get('only') ? Q.get('only').split(',') : null;
const BG = { neutral: '#8c8a90', dark: '#1a1220', brass: '#5e3c16' };
function sceneBg(w, h, ground = 0.55) { // a small HD-2D backdrop: warm sky, distant hills, grass
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#f0b47c'); gr.addColorStop(ground - 0.1, '#e8c89c'); gr.addColorStop(ground, '#8aa060'); gr.addColorStop(1, '#4f6a34'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = '#9a8a88'; for (let x = 0; x < w; x += 4) g.fillRect(x, h * ground - 5 - 5 * Math.sin(x * 0.03), 4, 9); return c;
}
const canvasOf = (pc) => (pc.commit ? pc.commit() : pc);
function panel(cv, scale, bg, pad = 4) { const c = document.createElement('canvas'); c.width = cv.width * scale + pad * 2; c.height = cv.height * scale + pad * 2; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; if (bg === 'scene') g.drawImage(sceneBg(c.width, c.height), 0, 0); else { g.fillStyle = BG[bg] || bg; g.fillRect(0, 0, c.width, c.height); } g.drawImage(cv, pad, pad, cv.width * scale, cv.height * scale); return c; }
function show(pc, label, parent, { scale = 3, bgs = ['neutral', 'dark', 'scene'] } = {}) {
  const cv = canvasOf(pc); const cell = document.createElement('div'); cell.className = 'cell'; const b = document.createElement('div'); b.className = 'bgs';
  b.appendChild(panel(cv, 1, 'neutral')); for (const k of bgs) b.appendChild(panel(cv, scale, k));
  cell.appendChild(b); const s = document.createElement('span'); s.textContent = `${label} (${cv.width}x${cv.height})`; cell.appendChild(s); parent.appendChild(cell);
}
function section(title) { const h = document.createElement('h2'); h.textContent = title; document.body.appendChild(h); const r = document.createElement('div'); r.className = 'row'; document.body.appendChild(r); return r; }
const t0 = performance.now();
if (secs.includes('ramps')) {
  const r = section('Material ramps in use (6-tone, dark -> light, hue shifted)');
  for (const k in RAMP) { const c = document.createElement('canvas'); const n = RAMP[k].length; c.width = n * 10; c.height = 12; const g = c.getContext('2d'); RAMP[k].forEach((h, i) => { g.fillStyle = h; g.fillRect(i * 10, 0, 10, 12); }); const cell = document.createElement('div'); cell.className = 'cell'; cell.appendChild(c); const s = document.createElement('span'); s.textContent = k; cell.appendChild(s); r.appendChild(cell); }
}
if (secs.includes('drawn') || secs.includes('items')) {
  const want = (n) => (only ? only.includes(n) : true) && (n.startsWith('item_') ? secs.includes('items') : secs.includes('drawn'));
  let r = null, lastGroup = '';
  for (const name of DRAWN_NAMES) {
    if (!want(name)) continue; const grp = name.startsWith('item_') ? 'Curio icons (on dark brass token colour, 1x + 2x)' : name.startsWith('mk_') ? 'Map standees' : 'Drawn objects';
    if (grp !== lastGroup) { r = section(grp); lastGroup = grp; }
    const variants = (DRAWN_FRAMES && DRAWN_FRAMES[name]) || [[]];
    variants.forEach((args, vi) => {
      try { const pc = drawn(name, ...args); const big = Math.max(pc.w, pc.h); const scale = Z || (name.startsWith('item_') ? 2 : big > 100 ? 2 : 3);
        const bgs = name.startsWith('item_') ? ['brass'] : vi === 0 ? ['neutral', 'dark', 'scene'] : ['neutral'];
        show(pc, name + (args.length ? '(' + args.join(',') + ')' : ''), r, { scale, bgs }); }
      catch (e) { const s = document.createElement('pre'); s.textContent = name + ': ' + e.stack; r.appendChild(s); }
    });
  }
}
if (secs.includes('critters')) {
  const { critterAtlasCanvas, CRITTER_LAYOUT } = await import('../src/gfx/critters.js');
  const atlas = critterAtlasCanvas(); const L = CRITTER_LAYOUT; const cellPx = L.cell; const scale = Z || 2;
  const r0 = section('Critters atlas (1x, sky background)'); { const c = document.createElement('canvas'); c.width = atlas.width; c.height = atlas.height; const g = c.getContext('2d'); g.fillStyle = '#7fb6dc'; g.fillRect(0, 0, c.width, c.height); g.drawImage(atlas, 0, 0); r0.appendChild(c); }
  for (const grp of L.groups) {
    if (only && !only.includes(grp.name)) continue;
    const rr = section(`${grp.name}: ${grp.frames.map((f) => f.name).join(' ')} (x${scale} + 1x in scene)`);
    const strip = document.createElement('canvas'); const n = grp.frames.length; strip.width = n * cellPx * scale; strip.height = cellPx * scale; const g = strip.getContext('2d'); g.imageSmoothingEnabled = false; g.fillStyle = BG.neutral; g.fillRect(0, 0, strip.width, strip.height);
    const one = sceneBg(n * cellPx, cellPx, 0.8); const g1 = one.getContext('2d');
    grp.frames.forEach((fr, i) => { const sx = (fr.index % L.cols) * cellPx, sy = Math.floor(fr.index / L.cols) * cellPx; g.drawImage(atlas, sx, sy, cellPx, cellPx, i * cellPx * scale, 0, cellPx * scale, cellPx * scale); g1.drawImage(atlas, sx, sy, cellPx, cellPx, i * cellPx, 0, cellPx, cellPx); g.fillStyle = '#6c6a72'; g.fillRect((i + 1) * cellPx * scale - 1, 0, 1, strip.height); });
    rr.appendChild(strip); one.style.alignSelf = 'flex-end'; rr.appendChild(one);
  }
}
if (secs.includes('icons')) {
  const { SPR, sprite, buildAtlas } = await import('../src/gfx/sprites.js');
  const r = section('Intent icons + particle sprites (1x, x4 on neutral and dark)');
  for (const k of Object.keys(SPR)) { if (only && !only.includes(k)) continue; try { show(sprite(k), k, r, { scale: Z || 4, bgs: ['neutral', 'dark'] }); } catch (e) { const s = document.createElement('pre'); s.textContent = k + ': ' + e.stack; r.appendChild(s); } }
  const ra = section('Particle atlas (16px cells, x3)'); const A = buildAtlas(); show(A.pc, 'atlas', ra, { scale: 3, bgs: ['dark'] });
}
const info = document.createElement('div'); info.textContent = `built in ${(performance.now() - t0).toFixed(0)} ms`; document.body.appendChild(info);
window.__done = true;
</script></body></html>
