<!doctype html><html><head><meta charset="utf-8"><title>Model Grid Check</title>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}canvas{display:block;width:100%;height:100%}
.l{position:fixed;transform:translate(-50%,0);color:#fff;font:600 10px system-ui;background:rgba(0,0,0,.6);padding:0 3px;pointer-events:none;white-space:nowrap}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
// Every model in assets/models/manifest.json through the game's own pipeline (Engine post FX, stage lights, toonModel or
// envModel), one per cell, to catch black / missing materials. ?mode=toon (default) | pbr   ?only=a,b   ?cols=10   ?page=0
import '../src/core/binfetch.js';
import * as THREE from 'three';
import { Engine } from '../src/core/engine.js';
import { getManifest, loadHDRI } from '../src/gfx/assets.js';
import { toonModel, envModel } from '../src/models/realworld.js';
import { loadModel } from '../src/gfx/assets.js';
import * as T from '../src/models/toon.js';
import { stageLights, GRADE_BATTLE, EXPOSURE } from '../src/gfx/lighting.js';
const q = new URLSearchParams(location.search); const mode = q.get('mode') || 'toon';
const eng = new Engine(document.getElementById('c'));
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x6f7f96); const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 500); eng.setWorld(sc, cam);
eng.setFx({ grade: GRADE_BATTLE, exposure: EXPOSURE.battle, bloom: [0.3, 0.4, 0.9] });
const hdr = await loadHDRI('sunset_dry_plain', eng.renderer).catch(() => null); if (hdr) { sc.environment = hdr.envMap; sc.environmentIntensity = 0.32; }
const man = await getManifest(); let names = q.get('only')?.split(',') || Object.keys(man.models); const cols = +(q.get('cols') || 10); const per = +(q.get('per') || 30); const page = +(q.get('page') || 0); names = names.slice(page * per, page * per + per);
const rows = Math.ceil(names.length / cols); const W = cols * 2.2, H = rows * 2.2;
stageLights(sc, { theme: 'meadow', box: new THREE.Box3(new THREE.Vector3(-W / 2 - 1, -0.5, -H / 2 - 1), new THREE.Vector3(W / 2 + 1, 3, H / 2 + 1)), target: new THREE.Vector3(0, 0, 0), mapSize: 2048 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(W + 6, H + 6), new THREE.MeshToonMaterial({ color: 0x8a8070 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; sc.add(ground);
cam.position.set(0, W * 0.62 + 2, W * 0.78 + 2); cam.lookAt(0, 0, 0.3); eng.start();
const report = []; window.__report = report;
await Promise.all(names.map(async (n, i) => {
  const x = (i % cols - (cols - 1) / 2) * 2.2, z = (Math.floor(i / cols) - (rows - 1) / 2) * 2.2;
  try { const o = mode === 'pbr' ? await envModel(n, () => 0) : mode === 'nolp' ? T.toonify(await loadModel(n.includes('#') ? n : n), {}) : await toonModel(n, () => 0); if (q.get('sh') === '0') o.traverse((m) => { m.castShadow = false; m.receiveShadow = false; });
    if (q.get('dbg') === 'white') o.traverse((m) => { if (m.isMesh) for (const mt of [].concat(m.material)) { mt.map = null; mt.needsUpdate = true; } });
    if (q.get('dbg') === 'front') o.traverse((m) => { if (m.isMesh) for (const mt of [].concat(m.material)) { mt.side = THREE.FrontSide; mt.needsUpdate = true; } });
    const b = new THREE.Box3().setFromObject(o); const s = 1.7 / Math.max(1e-3, b.max.x - b.min.x, b.max.y - b.min.y, b.max.z - b.min.z); o.scale.multiplyScalar(s); const b2 = new THREE.Box3().setFromObject(o); o.position.set(x - (b2.min.x + b2.max.x) / 2, -b2.min.y, z - (b2.min.z + b2.max.z) / 2); sc.add(o);
    const info = []; o.traverse((m) => { if (!m.isMesh) return; for (const mt of [].concat(m.material)) info.push(`${mt.type}${mt.map ? '+map' : ''}${mt.vertexColors ? '+vc' : ''}${mt.metalness > 0.5 ? '+metal' : ''} c=${mt.color?.getHexString()}`); });
    report.push(n + ': ' + [...new Set(info)].join(' | '));
    const el = document.createElement('div'); el.className = 'l'; el.textContent = i + ' ' + n; document.body.appendChild(el); el._p = new THREE.Vector3(x, 0, z + 0.9);
  } catch (e) { report.push(n + ': FAIL ' + e.message); }
}));
const place = () => { for (const el of document.querySelectorAll('.l')) { const p = el._p.clone().project(cam); el.style.left = ((p.x * 0.5 + 0.5) * innerWidth) + 'px'; el.style.top = ((-p.y * 0.5 + 0.5) * innerHeight) + 'px'; } }; place(); addEventListener('resize', place);
window.__ready = true;
</script></body></html>
